version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: apparel_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: apparel_inventory
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: apparel_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/apparel_inventory
      - JWT_SECRET=apparel_super_secret_jwt_key_production_ready
      - JWT_EXPIRE=7d
    depends_on:
      - mongodb

volumes:
  mongo_data:
