name = "apparel-inventory"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_ENV = "production"

# Create the database with `npx wrangler d1 create apparel-inventory`
# and replace this placeholder with the returned database_id.
[[d1_databases]]
binding = "DB"
database_name = "apparel-inventory"
database_id = "22f31262-f12b-4cb8-a7f2-a5403aa1c0ad"
migrations_dir = "worker/migrations"
